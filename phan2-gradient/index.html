/* ===== Slide + khối tự co giãn ===== */
.s{position:absolute;inset:0;display:none;overflow:hidden}
.s.on{display:block}
.fit{position:absolute;left:0;top:0;transform-origin:0 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:32px;align-items:center}
.s.cols .fit{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
.s.two .fit,.s .fit.stk{display:block}
.fit>div{min-width:0}
.s .fit.stk>div+div{margin-top:20px}
.fit>div:first-child>p.mut:first-child{display:inline-block;margin:0 0 .6em;padding:3px 12px;font:600 12.5px system-ui,sans-serif;letter-spacing:.04em;color:var(--pos2);background:var(--tint);border:1px solid var(--fln);border-radius:99px}
.s.two .fit>div+div{margin-top:12px}
